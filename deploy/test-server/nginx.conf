# Single public host for the test server: the iPhone talks to ONE domain.
#   /cali-media/...  -> MinIO (presigned GET URLs minted by the API; read only)
#   everything else  -> the CALI API
#
# Two details make the presigned URLs verify:
#   * the request path reaches MinIO unchanged (proxy_pass has no URI part, so nothing is rewritten);
#   * Host is forwarded as the client sent it, because SigV4 signs `host:<authority>`.
# The bucket name below must equal Media__Storage__Bucket.

server {
    listen 80;
    server_name _;

    # The API enforces its own body limits; this only keeps nginx from rejecting a larger sync push first.
    client_max_body_size 8m;

    location /cali-media/ {
        limit_except GET HEAD { deny all; }
        proxy_pass http://minio:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_buffering off;
    }

    location / {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
    }
}
