# XcodeGen spec for the CALI iOS app (ADR-011: the .xcodeproj is generated, never committed).
#   xcodegen generate --spec ios/project.yml   ->  ios/CaliApp.xcodeproj
# Bundle IDs, team and versions live in ios/Config/*.xcconfig (placeholders only).
# The generated Info.plist files are written next to the sources and are git-ignored.
name: CaliApp

options:
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"

packages:
  # Pure workout domain (reducer, reconcile, clock). The app links the library product only.
  CaliDomain:
    path: Packages/CaliDomain
  # POC-002 single-writer coordinator over GRDB (docs/20 phase 0). Pinned exact; CaliCore/Package.swift
  # pins the same version.
  GRDB:
    url: https://github.com/groue/GRDB.swift
    exactVersion: 7.12.0
  CaliCore:
    path: Packages/CaliCore

targets:
  CaliApp:
    type: application
    platform: iOS
    sources:
      - path: CaliApp
      # Compiled into both the app and the widget extension (ActivityAttributes must match).
      - path: Shared
    configFiles:
      Debug: Config/CaliApp.xcconfig
      Release: Config/CaliApp.xcconfig
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CALI_API_BASE_URL: ""
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Only the app copy of ios/Shared/POCLiveActivityIntents.swift calls the coordinator (ADR-013).
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) CALI_APP_PROCESS"
    info:
      path: CaliApp/Info.plist
      properties:
        CFBundleDisplayName: COAMI
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CaliBuildSHA: $(CALI_BUILD_SHA)
        # Release API base URL (https). Empty = no server: the app stays local-only. Set it per build, never commit a real host.
        CaliAPIBaseURL: $(CALI_API_BASE_URL)
        NSSupportsLiveActivities: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    dependencies:
      - package: CaliDomain
        product: CaliDomain
      - package: CaliCore
        product: CaliCore
      - target: CaliActivityWidget
        embed: true

  CaliActivityWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: CaliActivityWidget
      - path: Shared
    configFiles:
      Debug: Config/CaliActivityWidget.xcconfig
      Release: Config/CaliActivityWidget.xcconfig
    settings:
      base:
        # Installed inside CaliApp.app/PlugIns only, not as a separate archive product.
        SKIP_INSTALL: "YES"
    info:
      path: CaliActivityWidget/Info.plist
      properties:
        CFBundleDisplayName: COAMI
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework

  CaliAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CaliAppTests
    configFiles:
      Debug: Config/CaliAppTests.xcconfig
      Release: Config/CaliAppTests.xcconfig
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        # Hosted tests: link against the app so `@testable import CaliApp` resolves.
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/CaliApp.app/CaliApp
        BUNDLE_LOADER: $(TEST_HOST)
    dependencies:
      - target: CaliApp

schemes:
  CaliApp:
    build:
      targets:
        CaliApp: all
        CaliAppTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CaliAppTests
    archive:
      config: Debug
