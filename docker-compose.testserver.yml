# Test-server overlay: MinIO (media) + nginx (one public host), on top of docker-compose.yml.
#   docker compose -f docker-compose.yml -f docker-compose.testserver.yml up -d --build
# Then point Tailscale (or any TLS terminator) at 127.0.0.1:${CALI_PROXY_HOST_PORT:-8081}:
#   tailscale serve --bg 8081
# Required in .env: CALI_PUBLIC_HOST, CALI_MINIO_ROOT_PASSWORD, CALI_MEDIA_READER_SECRET (MinIO read-only user cali-api-ro).
# Catalog seed (exercises + media): deploy/test-server/catalog/README.md.
# The API still runs in Development here. Nothing in this file is for production.

services:
  minio:
    image: bitnamilegacy/minio:2025.7.23
    environment:
      MINIO_ROOT_USER: ${CALI_MINIO_ROOT_USER:-caliadmin}
      MINIO_ROOT_PASSWORD: ${CALI_MINIO_ROOT_PASSWORD:?Set CALI_MINIO_ROOT_PASSWORD in .env}
      MINIO_DEFAULT_BUCKETS: cali-media
    ports:
      - "127.0.0.1:${CALI_MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    volumes:
      - minio-data:/bitnami/minio/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  api:
    environment:
      # The URL the iPhone uses: presigned URLs are signed for exactly this host and path-style `/cali-media/<key>`.
      Media__Storage__Endpoint: https://${CALI_PUBLIC_HOST:?Set CALI_PUBLIC_HOST in .env}
      Media__Storage__Bucket: cali-media
      Media__Storage__Region: us-east-1
      Media__Storage__AccessKeyId: cali-api-ro
      Media__Storage__SecretAccessKey: ${CALI_MEDIA_READER_SECRET:?Set CALI_MEDIA_READER_SECRET in .env}

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - api
      - minio
    volumes:
      - ./deploy/test-server/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:${CALI_PROXY_HOST_PORT:-8081}:80"

volumes:
  minio-data:
