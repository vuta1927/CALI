openapi: 3.1.0
info:
  title: CALI Training Companion API
  version: 1.0.0
  description: >-
    Offline-first Calisthenics training API. Device writes use idempotent sync
    mutation IDs; AI analyzes completed, synchronized sessions asynchronously.
servers:
  - url: https://api.example.com
    description: Placeholder only, replace per environment.
tags:
  - name: Identity
  - name: Catalog
  - name: Plans
  - name: Sync
  - name: Coaching
  - name: Ops
security:
  - bearerAuth: []
paths:
  /v1/auth/apple:
    post:
      tags: [Identity]
      summary: Exchange validated Apple identity token for application tokens
      description: >-
        BE-005, ADR-071. The server checks the Apple identity token (RS256 signature against Apple's published keys,
        issuer `https://appleid.apple.com`, audience = the app bundle id, expiry and the `nonce` claim) and maps its
        `sub` to a user, creating one on the first sign-in. `nonce` is the RAW random string; the app must give Apple
        its lowercase hex SHA-256 as the authorization request nonce, because Apple copies that value into the token
        and the server compares it with the hash of `nonce`. A nonce works once: replaying a token or reusing a
        nonce is 401. Every refusal is the same 401 with no reason. The response is never cached. Anonymous, rate
        limited per client IP. 503 means Apple's keys could not be fetched; retry later.
      security: []
      operationId: authenticateWithApple
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppleAuthRequest'
      responses:
        '200':
          description: Tokens for authenticated app session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          description: Request body is larger than 16 KiB
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '415':
          description: Content-Type is not application/json
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          description: Apple's signing keys cannot be fetched, or Sign in with Apple is not configured; retry later
          headers:
            Retry-After:
              description: Delay before retry in seconds
              schema: {type: integer, minimum: 1}
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
  /v1/auth/refresh:
    post:
      tags: [Identity]
      summary: Rotate refresh token
      description: >-
        BE-005, ADR-071. Every refresh token works once: the response carries the next one and the presented one is
        spent. Presenting a spent token again (a replay, or a client that retried after losing the response) revokes
        the whole session, so the client must send one refresh at a time and keep the newest token. Unknown, expired,
        revoked, reused and malformed tokens are all the same 401 with no reason. `deviceId`, when the session was
        started with one, must match it. The response is never cached. Anonymous (the refresh token is the credential),
        rate limited per client IP.
      operationId: refreshAuthToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Rotated tokens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          description: Request body is larger than 16 KiB
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '415':
          description: Content-Type is not application/json
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '429':
          $ref: '#/components/responses/RateLimited'
  /v1/me:
    get:
      tags: [Identity]
      summary: Current user profile
      operationId: getCurrentUser
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Token is valid but its subject has no active user record (`code` = `user_not_found`).
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
  /v1/exercises:
    get:
      tags: [Catalog]
      summary: List visual exercise catalog
      operationId: listExercises
      security: []
      parameters:
        - name: q
          in: query
          schema: {type: string, maxLength: 100}
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/ExerciseType'
        - name: equipment
          in: query
          schema: {type: string, maxLength: 50}
        - name: cursor
          in: query
          description: Opaque `nextCursor` from the previous page; ordering is (slug, id), stable under inserts.
          schema: {type: string}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
      description: >-
        BE-001. Only published exercises; media lists the newest public, reviewed version per kind.
        BE-006 (ADR-072): each media item carries a short-lived signed `url` and its `urlExpiresAt`;
        fetch it with a plain GET, no credentials. The response is `Cache-Control: no-store` because
        those URLs expire. Anonymous, rate limited per client IP.
      responses:
        '200':
          description: Page of approved exercises
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExercisePage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
  /v1/exercises/{id}:
    get:
      tags: [Catalog]
      summary: Exercise details and media metadata
      operationId: getExercise
      security: []
      description: >-
        Media `url` values are short-lived signed URLs (BE-006, ADR-072) and the response is
        `Cache-Control: no-store`.
      parameters:
        - $ref: '#/components/parameters/ExerciseId'
      responses:
        '200':
          description: Exercise details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exercise'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
  /v1/criteria-config:
    get:
      tags: [Catalog]
      summary: Published set-entry criteria config and indicator set
      description: >-
        CON-008 (docs/18 §5, ADR-058, ADR-066). Read-only publisher content, no user data, so no
        authentication (like the catalog). Without `version` returns the latest published criteria
        config; with `version` returns that published version so history recorded under an older
        version can be rendered (docs/18 §5.3). The indicator set is always the current one. The
        strong ETag covers both parts (`"c{criteriaVersion}.i{indicatorSetVersion}"`); a matching
        `If-None-Match` returns 304 without a body. There is no write endpoint: the portal publishes
        new immutable versions later (ADR-051). Anonymous, so it is rate limited per client IP
        (429 with Retry-After) and the response is cacheable by a shared cache in front of the API
        (docs/11 §2).
      operationId: getCriteriaConfig
      security: []
      parameters:
        - name: version
          in: query
          required: false
          schema: {type: integer, minimum: 1}
        - name: If-None-Match
          in: header
          required: false
          schema: {type: string, maxLength: 200}
      responses:
        '200':
          description: Criteria config with the current indicator set
          headers:
            ETag:
              description: Strong validator for criteria version + indicator set version.
              schema: {type: string}
            Cache-Control:
              description: >-
                `public, max-age=300`: a CDN or reverse proxy may serve repeat requests for up to
                5 minutes without reaching the API; afterwards clients and caches revalidate with
                If-None-Match. Clients keep the last copy for offline use.
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CriteriaConfig'}
        '304':
          description: Not modified; the cached copy for this ETag is current.
          headers:
            ETag:
              schema: {type: string}
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: The requested `version` is not published (`code` = `criteria_version_not_found`).
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '429':
          $ref: '#/components/responses/RateLimited'
  # CON-010 begin: voice pack (docs/02 §5, docs/10 §7; ADR-072, ADR-077, ADR-078).
  /v1/voice-pack:
    get:
      tags: [Catalog]
      summary: Published voice cue pack (pre-rendered TTS) for one locale
      description: >-
        CON-010 (ADR-077). Short spoken cues ("Hết giờ nghỉ. Vào set tiếp theo.") rendered once on the
        server by the publisher TTS job (vbee.vn) and played by the device during a workout, also while
        it is locked, as a local notification sound (ADR-078). Read-only publisher content with no user
        data, so no authentication (like the catalog and criteria config). Without `version` returns the
        latest published pack for `locale`; with `version` returns that published pack. A published pack
        is immutable: changing a sentence or the voice publishes a new version. Audio URLs are short-lived
        signed URLs (ADR-072); clients download every cue once, verify `sha256` and keep the files for
        offline use, so `expiresAt` only bounds the download window. The strong ETag is
        `"{locale}.v{version}"`; a matching `If-None-Match` returns 304 without a body. Anonymous, so it
        is rate limited per client IP (429 with Retry-After).
      operationId: getVoicePack
      security: []
      parameters:
        - name: locale
          in: query
          required: true
          description: 'BCP 47 tag. v1 publishes vi-VN only.'
          schema: {$ref: '#/components/schemas/VoiceLocale'}
        - name: version
          in: query
          required: false
          schema: {type: integer, minimum: 1}
        - name: If-None-Match
          in: header
          required: false
          schema: {type: string, maxLength: 200}
      responses:
        '200':
          description: The voice pack with freshly signed audio URLs
          headers:
            ETag:
              description: Strong validator for locale + pack version.
              schema: {type: string}
            Cache-Control:
              description: >-
                `private, max-age=60`: the body carries signed URLs, so a shared cache must not keep it
                past their lifetime; clients revalidate with If-None-Match and keep the downloaded audio.
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VoicePack'}
        '304':
          description: Not modified; the cached pack for this ETag is current.
          headers:
            ETag:
              schema: {type: string}
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: >-
            No pack is published for `locale`, or the requested `version` is not published
            (`code` = `voice_pack_not_found`). Clients keep their cached pack or fall back to the
            default notification sound.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '429':
          $ref: '#/components/responses/RateLimited'
  # CON-010 end
  /v1/plans:
    get:
      tags: [Plans]
      summary: List user's synced plan revisions
      operationId: listPlans
      description: >-
        BE-001: the caller's non-deleted plan revisions (all statuses, including superseded and
        archived) ordered by creation time then id. The cursor is opaque; revisions created after a
        page was read appear on later pages, none are skipped or repeated. Only the token subject's
        plans are ever returned.
      parameters:
        - name: cursor
          in: query
          description: '`nextCursor` from the previous page. An unknown or malformed cursor is a 400.'
          schema: {type: string, maxLength: 512}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
      responses:
        '200':
          description: Synced plans
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
    post:
      tags: [Plans]
      summary: Create a plan online (offline clients should prefer sync push)
      operationId: createPlan
      description: >-
        BE-002: creates a root revision (revision 1, status current, lineageId = id, no parent).
        Validation is the same as for sync push (docs/06). Idempotent (ADR-068): a repeat with the
        same Idempotency-Key and an equivalent body (same JSON after key ordering and number
        normalization) returns the stored 201 body; the same key with a different body is 409
        `idempotency_key_reused`. Only successful requests are stored, so a failed request can be
        retried with the same key. Validation errors are 400 `validation_failed` with `errors`
        keyed by field path (e.g. `workouts[0].exercises[1].target.repMax`). Exceeding the limit on
        non-deleted plans (`plan_count_limit`, 50) is 409 `plan_count_limit`; an id already in use
        is 409 `conflict`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlanRequest'
      responses:
        '201':
          description: Created plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingPlan'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Token is valid but its subject has no active user record (`code` = `user_not_found`).
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '409':
          description: >-
            `code` = `idempotency_key_reused` (same key, different request), `plan_count_limit`
            (non-deleted plan limit reached) or `conflict` (an id is already in use).
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '413':
          description: Request body larger than 1 MiB (`code` = `payload_too_large`).
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '415':
          description: Content-Type is not JSON (`code` = `unsupported_media_type`).
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '429':
          $ref: '#/components/responses/RateLimited'
  /v1/sync/push:
    post:
      tags: [Sync]
      summary: Push batch of locally committed mutations
      operationId: syncPush
      description: >-
        Atomically process each mutation, including idempotent receipt and user
        change-log entry. Per-mutation conflicts do not fail unrelated mutations.
        The first push from a `deviceId` registers it for the caller (`devices` row
        upserted in the same transaction, `last_seen_at` refreshed); ADR-033.
        The whole push is one transaction; each mutation runs in its own savepoint so a
        rejected or conflicting mutation leaves the others applied. A malformed envelope
        or batch fails the whole request with 400 before anything is written (ADR-069).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncPushRequest'
      responses:
        '200':
          description: Per-mutation results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncPushResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Token is valid but its subject has no active user record (`code` = `user_not_found`); nothing is applied.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '409':
          description: '`deviceId` is already registered to another user (`code` = `device_owner_mismatch`); nothing is applied (ADR-033).'
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '413':
          description: Request body larger than 1 MiB (`code` = `payload_too_large`).
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '415':
          description: Content-Type is not JSON (`code` = `unsupported_media_type`).
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '429':
          $ref: '#/components/responses/RateLimited'
  /v1/sync/pull:
    get:
      tags: [Sync]
      summary: Pull changes since last acknowledged cursor
      description: >-
        The caller's change feed in commit order (ADR-070). Omit `cursor` for the initial sync, which returns the
        whole feed from the start (the latest state of every entity plus tombstones still retained). Save
        `nextCursor` in the same local transaction that applies the page. A page may repeat a change the device
        already holds (its own pushes appear in the feed): applying it is an idempotent upsert. The response is
        never cached (`Cache-Control: no-store`).
      operationId: syncPull
      parameters:
        - name: cursor
          in: query
          description: >-
            A `nextCursor` or `changeId` this server issued to the same user. Anything else (malformed, altered,
            another user's) is a 400. Omit for initial sync.
          schema: {type: string, maxLength: 128}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 100}
      responses:
        '200':
          description: Ordered change page with next cursor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncPullResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '410':
          description: >-
            The cursor is older than the change-log retention window (180 days by default), or ahead of the feed.
            Problem `code` is `cursor_expired`. The client keeps unsynced outbox rows, resets its pull cursor and
            pulls again without a cursor (docs/08 section 7).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
  /v1/analyses:
    post:
      tags: [Coaching]
      summary: Enqueue AI review for synchronized completed session
      operationId: requestAnalysis
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalysisRequest'
      responses:
        '202':
          description: Job queued or already queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisReceipt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/analyses/{id}:
    get:
      tags: [Coaching]
      summary: Check AI review status and structured output
      operationId: getAnalysis
      parameters:
        - $ref: '#/components/parameters/AnalysisId'
      responses:
        '200':
          description: Analysis result or job status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Analysis'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/recommendations/{id}/decision:
    post:
      tags: [Coaching]
      summary: Accept or reject suggestion; accepting creates new plan revision
      operationId: decideRecommendation
      parameters:
        - $ref: '#/components/parameters/RecommendationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecommendationDecisionRequest'
      responses:
        '200':
          description: Recorded decision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationDecisionResult'
        '409':
          $ref: '#/components/responses/Conflict'
        '404':
          $ref: '#/components/responses/NotFound'
  /health/live:
    get:
      tags: [Ops]
      summary: Liveness probe - process is up; no dependency is checked
      operationId: healthLive
      security: []
      responses:
        '200':
          description: Process alive
          content:
            text/plain:
              schema: {type: string, example: Healthy}
  /health/ready:
    get:
      tags: [Ops]
      summary: Readiness probe - database reachable
      operationId: healthReady
      security: []
      responses:
        '200':
          description: Ready to serve traffic
          content:
            text/plain:
              schema: {type: string, example: Healthy}
        '503':
          description: A dependency (PostgreSQL) is unavailable; details are logged, never returned
          content:
            text/plain:
              schema: {type: string, example: Unhealthy}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ExerciseId:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
    AnalysisId:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
    RecommendationId:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, format: uuid}
  responses:
    BadRequest:
      description: Request validation failed
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Unauthorized:
      description: Not authenticated or token invalid
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    NotFound:
      description: Resource not found under current user scope
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Conflict:
      description: Resource version or business conflict
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    RateLimited:
      description: Rate limit reached
      headers:
        Retry-After:
          description: Delay before retry in seconds
          schema: {type: integer, minimum: 1}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
  schemas:
    Problem:
      type: object
      required: [type, title, status, code, traceId]
      properties:
        type: {type: string}
        title: {type: string}
        status: {type: integer}
        code: {type: string}
        traceId: {type: string}
        detail: {type: string, description: 'Optional human-readable detail; always omitted for 5xx so no server internals leak.'}
        errors: {type: object, additionalProperties: true}
    AppleAuthRequest:
      type: object
      required: [identityToken, nonce]
      properties:
        identityToken: {type: string, minLength: 10, maxLength: 8192}
        nonce:
          type: string
          minLength: 8
          maxLength: 256
          description: Raw random string. The app gives Apple its lowercase hex SHA-256 (ADR-071).
        deviceId:
          type: string
          format: uuid
          description: The sync device id; a later refresh that sends a different one is refused.
    RefreshTokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: {type: string, minLength: 10, maxLength: 128}
        deviceId: {type: string, format: uuid}
    AuthTokens:
      type: object
      required: [accessToken, refreshToken, expiresInSeconds, user]
      properties:
        accessToken:
          type: string
          description: Short-lived bearer JWT (15 minutes by default). Sessions are not checked per request, so a revoked session stays usable until this expires.
        refreshToken:
          type: string
          description: Opaque single-use token (43 characters). Store only the newest one (Keychain).
        expiresInSeconds: {type: integer, minimum: 1, description: Lifetime of `accessToken`.}
        user: {$ref: '#/components/schemas/UserProfile'}
    UserProfile:
      type: object
      required: [id, timezone, createdAt]
      properties:
        id: {type: string, format: uuid}
        displayName: {type: [string, 'null']}
        timezone: {type: string, example: Asia/Bangkok}
        createdAt: {type: string, format: date-time}
    ExerciseType:
      type: string
      description: >-
        Catalog exercise type; also the prescription kind of PlannedTarget. `distance` and
        `duration` are running types (CON-004, docs/19 §4.1). CON-006 adds `load` (weight x reps,
        ADR-062).
      enum: [static_hold, reps, timed_reps, interval, skill_attempt, distance, duration, load]
    Discipline:
      type: string
      description: >-
        Training discipline (docs/18 §4, docs/19 §4.1). CON-004 adds `running`. Used by
        `Exercise.discipline` (CON-006, ADR-061); `mixed` exists only for plans (PrimaryDiscipline).
      enum: [calisthenics, gym, running]
    PrimaryDiscipline:
      type: string
      description: >-
        Main discipline of a training plan (CON-003, docs/19 §4.1): a Discipline value or `mixed`.
        v1 plans default to `calisthenics`.
      enum: [calisthenics, running, gym, mixed]
    PlanKind:
      type: string
      description: >-
        CON-003 (ADR-035). `weekly` repeats by weekday; `event` prepares for a dated event and
        requires `eventDate`.
      enum: [weekly, event]
    MeasurementType:
      type: string
      description: >-
        Primary measured quantity of an exercise (docs/18 §4, docs/19 §4.1). CON-004 adds
        `distance` and `duration`; CON-006 adds `load` together with the `exercise.measurementType`
        field. Pace is derived from distance and duration and is never stored. CON-006 (ADR-060):
        derived from ExerciseType, never stored or chosen separately: static_hold->hold,
        reps/timed_reps/skill_attempt->reps, interval/duration->duration, distance->distance,
        load->load.
      enum: [hold, reps, load, distance, duration]
    ExerciseMedia:
      type: object
      required: [id, kind, contentVersion, mimeType, sha256, license]
      properties:
        id: {type: string, format: uuid}
        kind:
          type: string
          enum: [thumbnail, poster, preview, tutorial, correct, incorrect]
        contentVersion: {type: integer, minimum: 1}
        url:
          type: [string, 'null']
          format: uri
          description: >-
            Short-lived signed read URL for the file (ADR-072); plain GET, no credentials, may be fetched
            with Range requests. Null when this deployment has no object storage; then keep the bundled
            or cached copy. Contains no credential, only a signature. Check `sha256` after download.
        urlExpiresAt:
          type: [string, 'null']
          format: date-time
          description: >-
            When `url` stops working; null exactly when `url` is null. Request the exercise again for a
            fresh URL (do not cache the response past this instant).
        mimeType: {type: string}
        sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        sizeBytes: {type: [integer, 'null'], minimum: 0}
        durationMs: {type: [integer, 'null'], minimum: 0}
        license: {type: string}
        attribution: {type: [string, 'null']}
    Exercise:
      type: object
      required: [id, slug, name, type, discipline, measurementType, equipment, cues, catalogVersion, media]
      properties:
        id: {type: string, format: uuid}
        slug: {type: string, example: tuck-planche}
        name: {type: string}
        type: {$ref: '#/components/schemas/ExerciseType'}
        # CON-006 (ADR-060, ADR-061): discipline, derived measurementType and focus tags.
        discipline: {$ref: '#/components/schemas/Discipline'}
        measurementType:
          allOf: [{$ref: '#/components/schemas/MeasurementType'}]
          readOnly: true
          description: Derived from `type` by the server (ADR-060); not stored.
        focusTags:
          type: array
          description: Free slugs such as `push` or `core` (ADR-061). Empty when none.
          maxItems: 10
          uniqueItems: true
          items: {type: string, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$', maxLength: 40}
        equipment:
          type: array
          items: {type: string}
        cues:
          type: array
          items: {type: string}
        catalogVersion: {type: integer, minimum: 1}
        media:
          type: array
          items: {$ref: '#/components/schemas/ExerciseMedia'}
    ExercisePage:
      type: object
      required: [items, hasMore]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Exercise'}
        nextCursor: {type: [string, 'null']}
        hasMore: {type: boolean}
    PlannedTarget:
      oneOf:
        - type: object
          required: [kind, holdSeconds]
          properties:
            kind: {const: static_hold}
            holdSeconds: {type: integer, minimum: 1, maximum: 3600}
          additionalProperties: false
        - type: object
          required: [kind, repMin, repMax]
          properties:
            kind: {const: reps}
            repMin: {type: integer, minimum: 1, maximum: 500}
            repMax: {type: integer, minimum: 1, maximum: 500}
          additionalProperties: false
        - type: object
          required: [kind, timeSeconds]
          properties:
            kind: {const: timed_reps}
            timeSeconds: {type: integer, minimum: 1, maximum: 3600}
          additionalProperties: false
        - type: object
          required: [kind, workSeconds, restSeconds]
          properties:
            kind: {const: interval}
            workSeconds: {type: integer, minimum: 1, maximum: 3600}
            restSeconds: {type: integer, minimum: 1, maximum: 3600}
          additionalProperties: false
        - type: object
          required: [kind, attempts]
          properties:
            kind: {const: skill_attempt}
            attempts: {type: integer, minimum: 1, maximum: 100}
          additionalProperties: false
        - type: object
          description: >-
            Running segment by distance (CON-004). Optional `durationSeconds` is the target time;
            target pace is derived, never stored. One set = one segment; rest uses restSeconds.
          required: [kind, distanceMeters]
          properties:
            kind: {const: distance}
            distanceMeters: {type: integer, minimum: 1, maximum: 500000}
            durationSeconds: {type: integer, minimum: 1, maximum: 86400}
          additionalProperties: false
        - type: object
          description: Running segment by time (CON-004).
          required: [kind, durationSeconds]
          properties:
            kind: {const: duration}
            durationSeconds: {type: integer, minimum: 1, maximum: 86400}
          additionalProperties: false
        - type: object
          description: >-
            Weight x reps (CON-006, ADR-062). One `loadKg` per set, kilograms only (ADR-046), at most
            2 decimals (server rule, ADR-020). Volume (reps x kg) is derived, never stored.
          required: [kind, reps, loadKg]
          properties:
            kind: {const: load}
            reps: {type: integer, minimum: 1, maximum: 500}
            loadKg: {type: number, minimum: 0, maximum: 1000}
          additionalProperties: false
    PlannedExercise:
      type: object
      required: [id, exerciseId, orderIndex, setCount, target, restSeconds]
      properties:
        id: {type: string, format: uuid}
        exerciseId: {type: string, format: uuid}
        orderIndex: {type: integer, minimum: 0}
        setCount: {type: integer, minimum: 1, maximum: 20}
        target: {$ref: '#/components/schemas/PlannedTarget'}
        restSeconds: {type: integer, minimum: 0, maximum: 3600}
    PlannedWorkout:
      type: object
      required: [id, weekday, orderIndex, exercises]
      properties:
        id: {type: string, format: uuid}
        weekday: {type: integer, minimum: 1, maximum: 7, description: '1=Monday'}
        title: {type: string, maxLength: 120, description: 'Optional; stored as empty string when omitted (ADR-027).'}
        orderIndex: {type: integer, minimum: 0}
        exercises:
          type: array
          items: {$ref: '#/components/schemas/PlannedExercise'}
    CreatePlanRequest:
      type: object
      required: [id, title, workouts]
      properties:
        id: {type: string, format: uuid}
        title: {type: string, minLength: 1, maxLength: 120}
        kind: {$ref: '#/components/schemas/PlanKind'}
        eventDate: {type: [string, 'null'], format: date, description: 'Required when kind = event (ADR-035).'}
        eventName: {type: [string, 'null'], minLength: 1, maxLength: 120}
        primaryDiscipline: {$ref: '#/components/schemas/PrimaryDiscipline'}
        workouts:
          type: array
          items: {$ref: '#/components/schemas/PlannedWorkout'}
    TrainingPlan:
      allOf:
        - $ref: '#/components/schemas/CreatePlanRequest'
        - type: object
          required: [revision, version, status]
          properties:
            revision: {type: integer, minimum: 1}
            version: {type: integer, minimum: 1, format: int64}
            status:
              type: string
              enum: [current, superseded]
              description: >-
                CON-003: revision status (ADR-036, breaking change ADR-056). Exactly one
                non-deleted `current` revision per lineage. The user-facing plan status (draft,
                scheduled, active, paused, completed, stopped, archived) is computed from
                activations, `endedAt` and `archivedAt` (docs/19 §4.2) and is never stored.
            parentPlanId: {type: [string, 'null'], format: uuid}
            lineageId:
              type: string
              format: uuid
              description: 'Id of the plan across its revisions; the root revision id. Derived by the server from parentPlanId when omitted.'
            endedAt: {type: [string, 'null'], format: date-time}
            endReason: {type: [string, 'null'], enum: [completed, stopped, null], description: 'Set together with endedAt.'}
            endNote: {type: [string, 'null'], maxLength: 500}
            archivedAt: {type: [string, 'null'], format: date-time, description: 'Archived plans are hidden from lists; independent of endedAt.'}
    PlanActivation:
      type: object
      description: >-
        CON-003 (docs/19 §4, BR-1). A period during which a plan lineage is followed. Pushed and
        pulled as sync entity `plan_activation`. I1: activations of one lineage never overlap.
        I2: on any local date at most `active_plan_limit` (server setting, default 3) lineages
        whose current revision is neither deleted nor ended have an activation; violations are
        rejected with MutationError `active_plan_limit`.
      required: [id, planLineageId, fromDate, timezone, version]
      properties:
        id: {type: string, format: uuid}
        planLineageId: {type: string, format: uuid}
        fromDate: {type: string, format: date}
        toDate: {type: [string, 'null'], format: date, description: 'Inclusive; null = open-ended.'}
        timezone: {type: string, minLength: 1, maxLength: 64, description: 'IANA time zone the local dates refer to.'}
        endReason: {type: [string, 'null'], enum: [paused, completed, stopped, deleted, null], description: 'Lifecycle command that closed the activation; requires toDate.'}
        version: {type: integer, minimum: 1, format: int64}
    # CON-005 begin: plan goals, phases and indicator definitions (docs/18 §6, docs/19 §4).
    IndicatorKind:
      type: string
      enum: [performance, adherence, volume, milestone, body]
    IndicatorDefinition:
      type: object
      description: >-
        CON-005 (docs/18 §6.1, ADR-051). Server/portal-owned, read-only for devices. `id` is a stable
        slug that is never reused; `kind`, `unit` and `aggregation` never change for an id, while
        `label`, `step`, `measurementTypes` and `enabled` may change and bump `version`.
        `enabled: false` only hides the indicator from pickers; existing goals keep it.
      required: [id, version, kind, label, unit, step, aggregation, measurementTypes, enabled]
      properties:
        id: {type: string, pattern: '^[a-z][a-z0-9_]{0,63}$'}
        version: {type: integer, minimum: 1}
        kind: {$ref: '#/components/schemas/IndicatorKind'}
        label: {type: string, minLength: 1, maxLength: 120}
        unit: {type: string, maxLength: 16, description: 'Display unit; may be empty for unitless counts.'}
        step: {type: number, exclusiveMinimum: 0, description: 'Picker increment for baseline and target.'}
        aggregation: {type: string, enum: [max, sum], description: 'How set results combine into the computed current value.'}
        measurementTypes:
          type: array
          uniqueItems: true
          description: 'Exercises offered for the indicator are filtered by these types; empty for adherence and body kinds.'
          items: {$ref: '#/components/schemas/MeasurementType'}
        enabled: {type: boolean}
    IndicatorDefinitionSet:
      type: object
      description: >-
        CON-005 / ADR-058. The versioned set of indicator definitions. No endpoint is added in
        CON-005: CON-008 embeds this object in `GET /v1/criteria-config` (ADR-066); offline the
        client uses its cached or bundled default set (same content as the db/005 seed). Set
        `version` = sum of the row versions in indicator_definitions (rows are never deleted and
        every change bumps a row version or adds a row, so it only grows); `publishedAt` = latest
        row `updated_at`.
      required: [version, publishedAt, indicators]
      properties:
        version: {type: integer, minimum: 1}
        publishedAt: {type: string, format: date-time}
        indicators:
          type: array
          items: {$ref: '#/components/schemas/IndicatorDefinition'}
    # CON-008 begin: criteria config (docs/18 §5; ADR-050, ADR-051, ADR-058, ADR-066, ADR-067).
    CriteriaConfig:
      type: object
      description: >-
        CON-008 (ADR-066). A published, immutable criteria config version (db/008
        criteria_config_versions) plus the current indicator set (ADR-058), served by
        `GET /v1/criteria-config` under one ETag. Read-only for devices; only the future portal
        publishes (ADR-051). Primary measure fields are not configured here: they follow the
        exercise measurementType (docs/18 §4, ADR-060). Clients skip criteria whose `type` they do
        not know and keep the last config for offline use; first launch uses the bundled version 1.
      required: [version, publishedAt, supportedTypes, criteria, indicators]
      additionalProperties: false
      properties:
        version: {type: integer, minimum: 1}
        publishedAt: {type: string, format: date-time}
        supportedTypes:
          type: array
          uniqueItems: true
          description: 'Criterion types the version uses. v1: number, choice, scale, chips, toggle.'
          items: {$ref: '#/components/schemas/CriterionType'}
        criteria:
          type: array
          maxItems: 50
          items: {$ref: '#/components/schemas/Criterion'}
        indicators: {$ref: '#/components/schemas/IndicatorDefinitionSet'}
    CriterionType:
      type: string
      pattern: '^[a-z][a-z_]{0,31}$'
      description: >-
        Open vocabulary: v1 values are number, choice, scale, chips and toggle. A client that does not
        know a type skips that criterion instead of failing (docs/18 §5.2).
    Criterion:
      type: object
      description: >-
        CON-008 (docs/18 §5.2). `id` is stable and never reused once data exists. Ids `rpe` and `pain`
        only control display of the rpe / painReported columns (ADR-045); holdSec, reps and loadKg are
        reserved for primary measures and never used. choice/chips need `options`; scale needs `min`
        and `max`. `appliesTo` (all present filters must match): the exercise discipline must match
        (`*` = any); when `measurementTypes` is present, the exercise measurementType (derived from its
        type, ADR-060) must be listed, which also works for personal exercises; when `exerciseIds` is
        present, the exercise id must be listed, unknown ids are ignored and personal exercises never
        match it (ADR-050, ADR-066). `required` is a client form rule only.
      required: [id, type, label, appliesTo, enabled]
      additionalProperties: false
      properties:
        id: {type: string, pattern: '^[a-z][a-zA-Z0-9_]{0,31}$', not: {enum: [holdSec, reps, loadKg]}}
        type: {$ref: '#/components/schemas/CriterionType'}
        label: {type: string, minLength: 1, maxLength: 120}
        hint: {type: string, maxLength: 240}
        icon: {type: string, pattern: '^[a-z][a-zA-Z0-9_]{0,31}$', description: 'Design-system icon name; unknown names render no icon.'}
        appliesTo: {$ref: '#/components/schemas/CriteriaAppliesTo'}
        options:
          type: array
          minItems: 1
          maxItems: 10
          items: {$ref: '#/components/schemas/CriterionOption'}
        min: {type: number, minimum: -100000, maximum: 100000}
        max: {type: number, minimum: -100000, maximum: 100000}
        step: {type: number, exclusiveMinimum: 0}
        unit: {type: string, maxLength: 16}
        prefill: {type: string, pattern: '^[a-zA-Z]{1,32}$', description: 'v1: previousSet (value of the previous set in the same execution). Unknown values = no prefill.'}
        splitsTrend: {type: boolean, default: false, description: 'A changed value starts a new series on the progress chart (docs/18 §5.2).'}
        required: {type: boolean, default: false}
        enabled: {type: boolean, description: 'Disabled criteria are not rendered; recorded values are kept.'}
      allOf:
        - if: {properties: {type: {enum: [choice, chips]}}}
          then: {required: [options]}
        - if: {properties: {type: {const: scale}}}
          then: {required: [min, max]}
        - if: {properties: {id: {const: rpe}}}
          then: {properties: {type: {const: scale}, min: {minimum: 1}, max: {maximum: 10}}}
        - if: {properties: {id: {const: pain}}}
          then: {properties: {type: {const: toggle}}}
    CriteriaAppliesTo:
      type: object
      required: [disciplines]
      additionalProperties: false
      properties:
        disciplines:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum: ['*', calisthenics, gym, running]
        measurementTypes:
          type: array
          minItems: 1
          uniqueItems: true
          description: 'Optional (ADR-066). Absent = any measurement type. No `*`: omit the field instead.'
          items: {$ref: '#/components/schemas/MeasurementType'}
        exerciseIds:
          type: array
          maxItems: 200
          uniqueItems: true
          items: {type: string, format: uuid}
    CriterionOption:
      type: object
      required: [v, label]
      additionalProperties: false
      properties:
        v: {type: string, pattern: '^[a-z][a-z0-9_]{0,31}$', description: 'Stored value; never reused with another meaning.'}
        label: {type: string, minLength: 1, maxLength: 60}
        hint: {type: string, maxLength: 120}
    # CON-010 begin: voice pack (ADR-077, ADR-078).
    VoiceLocale:
      type: string
      pattern: '^[a-z]{2,3}-[A-Z]{2}$'
      description: 'BCP 47 language-region tag. v1: vi-VN.'
    VoiceCueKey:
      type: string
      pattern: '^[a-z][a-z0-9_]{0,31}(\.[a-z0-9_]{1,32}){1,3}$'
      description: >-
        Open vocabulary naming when the device plays the cue (ADR-078). v1 keys: rest.ending_10s,
        rest.done, rest.done_next_exercise, hold.done, timed.halfway, timed.done, countdown.start,
        session.done. A key keeps its meaning forever; a client skips keys it does not know and never
        fails on them.
    VoicePack:
      type: object
      description: >-
        CON-010 (ADR-077). One published, immutable voice pack (db/011 voice_pack_versions +
        voice_cues). `voice` is a display label of the TTS voice, never a provider credential.
      required: [locale, version, publishedAt, voice, cues]
      additionalProperties: false
      properties:
        locale: {$ref: '#/components/schemas/VoiceLocale'}
        version: {type: integer, minimum: 1}
        publishedAt: {type: string, format: date-time}
        voice: {type: string, minLength: 1, maxLength: 60}
        cues:
          type: array
          minItems: 1
          maxItems: 64
          items: {$ref: '#/components/schemas/VoiceCue'}
    VoiceCue:
      type: object
      description: >-
        One spoken sentence. `text` is exactly what the audio says (shown as the notification body and
        read by VoiceOver); keys are unique within a pack.
      required: [key, text, audio]
      additionalProperties: false
      properties:
        key: {$ref: '#/components/schemas/VoiceCueKey'}
        text: {type: string, minLength: 1, maxLength: 80}
        audio: {$ref: '#/components/schemas/VoiceCueAudio'}
    VoiceCueAudio:
      type: object
      description: >-
        CAF container, IMA4 mono, so iOS can play it in-app and as a UNNotificationSound (iOS caps
        notification sounds at 30 s). `url` and `expiresAt` are null when the deployment has no object
        storage (Development, ADR-072); the client then uses the default sound. `sha256` (lowercase hex)
        covers the file bytes.
      required: [url, expiresAt, format, sha256, byteSize, durationMs]
      additionalProperties: false
      properties:
        url: {type: ['string', 'null'], format: uri}
        expiresAt: {type: ['string', 'null'], format: date-time}
        format: {type: string, enum: [caf_ima4]}
        sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        byteSize: {type: integer, minimum: 1, maximum: 1048576}
        durationMs: {type: integer, minimum: 1, maximum: 30000}
    # CON-010 end
    GoalStatus:
      type: string
      enum: [active, reached, achieved, missed, archived]
      description: >-
        docs/18 §6.2. Changed only by the client. `reached` is a suggestion from computed progress;
        `achieved` is always a user confirmation (requires achievedAt) and is never set by the server.
    GoalTarget:
      description: 'One value, or a {min, max} range (body goals). min <= max (MutationError validation_failed, field target.max).'
      oneOf:
        - type: object
          additionalProperties: false
          required: [value]
          properties:
            value: {type: number, minimum: 0, maximum: 999999999}
        - type: object
          additionalProperties: false
          required: [min, max]
          properties:
            min: {type: number, minimum: 0, maximum: 999999999}
            max: {type: number, minimum: 0, maximum: 999999999}
    PlanPhase:
      type: object
      description: >-
        CON-005 (docs/18 §6.5). Ordered phase of one plan revision; synced as entity `plan_phase`.
        Week labels and done/current/upcoming are computed on the device. A new revision gets new
        phase ids (ADR-057). Every write is audited (ADR-059).
      required: [id, planId, orderIndex, name, weeks, version]
      properties:
        id: {type: string, format: uuid}
        planId: {type: string, format: uuid, description: 'Plan revision id; immutable.'}
        orderIndex: {type: integer, minimum: 0}
        name: {type: string, minLength: 1, maxLength: 120}
        weeks: {type: integer, minimum: 1, maximum: 52}
        description: {type: [string, 'null'], maxLength: 500}
        version: {type: integer, minimum: 1, format: int64}
    PlanGoal:
      type: object
      description: >-
        CON-005 (docs/18 §6.1-§6.4, docs/19 §4). A goal of a plan lineage; synced as entity
        `plan_goal`. `current` is computed on the device and never sent. `baseline` is the client's
        snapshot (ADR-044). `scopePhaseId` null = scope plan; a deleted phase is shown as plan.
        `planLineageId`, `indicatorId` and `exerciseId` are immutable (ADR-047, ADR-057).
        The server rejects unlock cycles (MutationError goal_unlock_cycle) and more than
        `pinned_goal_limit` (server setting, default 3, ADR-048) pinned goals per lineage
        (MutationError pinned_goal_limit). Every write is audited (ADR-059).
      required: [id, planLineageId, title, indicatorId, target, status, pinned, version]
      properties:
        id: {type: string, format: uuid}
        planLineageId: {type: string, format: uuid}
        title: {type: string, minLength: 1, maxLength: 120}
        indicatorId: {type: string, pattern: '^[a-z][a-z0-9_]{0,63}$'}
        exerciseId: {type: [string, 'null'], format: uuid, description: 'Required for performance, volume and milestone indicators; measurement type must match the indicator.'}
        baseline: {type: [number, 'null'], minimum: 0, maximum: 999999999}
        target: {$ref: '#/components/schemas/GoalTarget'}
        scopePhaseId: {type: [string, 'null'], format: uuid}
        unlockAfterGoalId: {type: [string, 'null'], format: uuid}
        status: {$ref: '#/components/schemas/GoalStatus'}
        achievedAt: {type: [string, 'null'], format: date-time, description: 'Required when status = achieved; kept when an achieved goal is archived; null otherwise.'}
        pinned: {type: boolean}
        note: {type: [string, 'null'], maxLength: 500}
        version: {type: integer, minimum: 1, format: int64}
    # CON-005 end
    # CON-007 begin
    BodyMeasurementKind:
      type: string
      enum: [weight]
      description: >-
        CON-007 (ADR-063). v1: `weight` only, in kilograms (ADR-046). The unit is fixed by the kind;
        there is no unit field. New kinds need a contract change (OpenAPI, entity-payloads, SQL CHECK).
    BodyMeasurement:
      type: object
      description: >-
        CON-007 (docs/07, docs/11; ADR-063, ADR-064). A user-entered body measurement; synced as entity
        `body_measurement` (device-writable, soft delete, several per day allowed). Sensitive data:
        never part of AI input (AnalysisRequest carries a session only), never shown on the Lock
        Screen, Live Activity or notifications. `value`: kilograms for `weight`, at most 2 decimals
        (excess decimals are rejected with validation_failed, never rounded). `measuredAt` must not
        be after the mutation's `clientChangedAt` (validation_failed).
      required: [id, kind, value, measuredAt, version]
      properties:
        id: {type: string, format: uuid}
        kind: {$ref: '#/components/schemas/BodyMeasurementKind'}
        value: {type: number, minimum: 20, maximum: 500}
        measuredAt: {type: string, format: date-time}
        version: {type: integer, minimum: 1, format: int64}
    # CON-007 end
    PlanPage:
      type: object
      required: [items, hasMore]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/TrainingPlan'}
        nextCursor: {type: [string, 'null']}
        hasMore: {type: boolean}
    SyncEntityType:
      type: string
      enum: [training_plan, planned_workout, planned_exercise, workout_session, exercise_execution, set_result, workout_note, plan_activation, plan_phase, plan_goal, body_measurement]
    SyncMutation:
      type: object
      description: >-
        Envelope fields are closed (ADR-030). `payload` is validated per `entityType`/`action`
        against contracts/entity-payloads.schema.json, which also rejects unknown payload fields.
      additionalProperties: false
      required: [mutationId, entityType, entityId, action, baseVersion, clientChangedAt, payload]
      properties:
        mutationId: {type: string, format: uuid}
        entityType:
          type: string
          minLength: 1
          maxLength: 64
          description: >-
            Writable types are listed in SyncEntityType. Any other value is accepted by the envelope
            and answered with a `forbidden_entity` result, so a newer client never fails a whole batch
            on an entity type this server does not accept (ADR-069).
        entityId: {type: string, format: uuid}
        action: {type: string, enum: [upsert, delete]}
        baseVersion: {type: integer, minimum: 0, format: int64}
        clientChangedAt: {type: string, format: date-time}
        payload:
          type: object
          additionalProperties: true
    SyncPushRequest:
      type: object
      additionalProperties: false
      required: [deviceId, mutations]
      properties:
        deviceId: {type: string, format: uuid}
        mutations:
          type: array
          minItems: 1
          maxItems: 100
          items: {$ref: '#/components/schemas/SyncMutation'}
    SyncMutationResult:
      type: object
      required: [mutationId, status]
      properties:
        mutationId: {type: string, format: uuid}
        status: {type: string, enum: [applied, duplicate, conflict, rejected]}
        serverVersion: {type: [integer, 'null'], format: int64}
        serverEntity: {type: [object, 'null'], additionalProperties: true}
        error: {$ref: '#/components/schemas/MutationError'}
    MutationError:
      type: [object, 'null']
      description: >-
        ADR-021. Results with `retryable: true` are never persisted as receipts, so the client may
        resend the same mutationId later (e.g. after the missing parent is applied). Non-retryable
        results are persisted and replayed with status `duplicate` for the same mutationId, except
        mutation_id_reused and forbidden_entity (ADR-069). The replay key is the mutation fingerprint
        over entityType, entityId, action, baseVersion and payload; clientChangedAt is not part of it.
      required: [code, message, retryable]
      properties:
        code:
          type: string
          enum: [dependency_missing, version_conflict, validation_failed, forbidden_entity, cross_user_reference, mutation_id_reused, active_plan_limit, plan_count_limit, pinned_goal_limit, goal_unlock_cycle]
          description: >-
            dependency_missing (status conflict, retryable) - a referenced parent is not applied yet;
            version_conflict (status conflict) - baseVersion != serverVersion, serverEntity returned;
            validation_failed (status rejected) - schema or business rule violation (ADR-020);
            forbidden_entity (status rejected, not persisted) - entityType not writable by devices;
            cross_user_reference (status rejected) - references an entity owned by another user;
            mutation_id_reused (status rejected, not persisted) - mutationId already used with a different payload (ADR-031);
            active_plan_limit (status rejected) - a plan_activation would make more than the server limit
            (default 3) plans followed on one local date (docs/19 I2, BR-2; mutations are applied in
            receive order, the later one is rejected, never retried);
            plan_count_limit (status rejected) - a training_plan would exceed the server limit (default 50)
            of non-deleted plans (ADR-041, BR-8);
            pinned_goal_limit (status rejected) - a plan_goal write would make more than the server limit
            (default 3, ADR-048) pinned non-deleted goals in one plan lineage (docs/18 §6.4; CON-005);
            goal_unlock_cycle (status rejected) - a plan_goal unlockAfterGoalId would close a cycle in the
            unlock chain (docs/18 §6.3; CON-005).
        message: {type: string}
        retryable: {type: boolean}
        details: {type: object, additionalProperties: true}
    SyncPushResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items: {$ref: '#/components/schemas/SyncMutationResult'}
    ChangeEntityType:
      type: string
      enum: [training_plan, planned_workout, planned_exercise, workout_session, exercise_execution, set_result, workout_note, plan_activation, plan_phase, plan_goal, body_measurement, ai_analysis, ai_recommendation]
    SyncChange:
      type: object
      required: [changeId, entityType, entityId, operation, serverVersion, payload]
      properties:
        changeId: {type: string, description: Opaque user-scoped sequence token; accepted as `cursor` to resume right after this change}
        entityType: {$ref: '#/components/schemas/ChangeEntityType'}
        entityId: {type: string, format: uuid}
        operation: {type: string, enum: [upsert, delete]}
        serverVersion: {type: integer, minimum: 1, format: int64}
        payload:
          type: object
          additionalProperties: true
          description: >-
            ADR-022. Discriminated by `entityType` + `operation`. delete -> `{id, deletedAt}`.
            upsert of a device-writable entity -> the same `<entityType>_payload` schema as push
            (contracts/entity-payloads.schema.json). ai_analysis -> `Analysis`; ai_recommendation ->
            `AnalysisRecommendation` plus `analysisId`.
          x-payload-schemas:
            training_plan: entity-payloads.schema.json#/$defs/training_plan_payload
            planned_workout: entity-payloads.schema.json#/$defs/planned_workout_payload
            planned_exercise: entity-payloads.schema.json#/$defs/planned_exercise_payload
            workout_session: entity-payloads.schema.json#/$defs/workout_session_payload
            exercise_execution: entity-payloads.schema.json#/$defs/exercise_execution_payload
            set_result: entity-payloads.schema.json#/$defs/set_result_payload
            workout_note: entity-payloads.schema.json#/$defs/workout_note_payload
            plan_activation: entity-payloads.schema.json#/$defs/plan_activation_payload
            plan_phase: entity-payloads.schema.json#/$defs/plan_phase_payload
            plan_goal: entity-payloads.schema.json#/$defs/plan_goal_payload
            body_measurement: entity-payloads.schema.json#/$defs/body_measurement_payload
            ai_analysis: 'components/schemas/Analysis'
            ai_recommendation: 'components/schemas/AnalysisRecommendation'
            delete: entity-payloads.schema.json#/$defs/delete_payload
    SyncPullResponse:
      type: object
      required: [changes, nextCursor, hasMore]
      properties:
        changes:
          type: array
          items: {$ref: '#/components/schemas/SyncChange'}
        nextCursor: {type: string, description: Position after the last change of this page; unchanged when the page is empty}
        hasMore: {type: boolean}
    AnalysisRequest:
      type: object
      required: [sessionId, sessionVersion]
      properties:
        sessionId: {type: string, format: uuid}
        sessionVersion: {type: integer, minimum: 1, format: int64}
    AnalysisStatus:
      type: string
      enum: [queued, running, completed, failed, superseded]
    AnalysisReceipt:
      type: object
      required: [analysisId, status]
      properties:
        analysisId: {type: string, format: uuid}
        status: {$ref: '#/components/schemas/AnalysisStatus'}
    AnalysisRecommendation:
      type: object
      required: [id, exerciseId, action, rationale, requiresApproval, decision]
      properties:
        id: {type: string, format: uuid}
        exerciseId: {type: [string, 'null'], format: uuid, description: 'Catalog uuid; null for session-level recommendations (ADR-026).'}
        action: {type: string, enum: [maintain, reduce, increase_hold, increase_reps, change_progression, needs_more_data]}
        proposedTarget:
          description: 'Full typed target (with `kind`) or null when no target change is proposed (ADR-032).'
          oneOf:
            - $ref: '#/components/schemas/PlannedTarget'
            - type: 'null'
        rationale: {type: string}
        requiresApproval: {type: boolean, const: true}
        decision: {type: string, enum: [proposed, accepted, rejected, superseded]}
    AnalysisOutput:
      type: object
      required: [schemaVersion, summary, confidence, observations, safetyFlags, recommendations]
      properties:
        schemaVersion: {type: string, const: '1.0'}
        summary: {type: string}
        confidence: {type: string, enum: [low, medium, high]}
        observations:
          type: array
          items:
            type: object
            required: [type, evidence]
            properties:
              type: {type: string}
              evidence: {type: string}
        fatigueLevel: {type: string, enum: [unknown, low, moderate, high]}
        safetyFlags:
          type: array
          items: {type: string}
        recommendations:
          type: array
          items: {$ref: '#/components/schemas/AnalysisRecommendation'}
    Analysis:
      type: object
      required: [id, sessionId, sessionVersion, status, createdAt]
      properties:
        id: {type: string, format: uuid}
        sessionId: {type: string, format: uuid}
        sessionVersion: {type: integer, format: int64}
        status: {$ref: '#/components/schemas/AnalysisStatus'}
        createdAt: {type: string, format: date-time}
        result:
          oneOf:
            - $ref: '#/components/schemas/AnalysisOutput'
            - type: 'null'
        failureReason: {type: [string, 'null']}
    RecommendationDecisionRequest:
      type: object
      required: [decision]
      if:
        properties:
          decision: {const: accepted}
      then:
        required: [expectedPlanVersion, targetPlanId]
      properties:
        decision: {type: string, enum: [accepted, rejected]}
        expectedPlanVersion: {type: integer, minimum: 1, format: int64}
        targetPlanId: {type: string, format: uuid}
    RecommendationDecisionResult:
      type: object
      required: [recommendationId, decision]
      properties:
        recommendationId: {type: string, format: uuid}
        decision: {type: string, enum: [accepted, rejected]}
        newPlanId: {type: [string, 'null'], format: uuid}
        newPlanVersion: {type: [integer, 'null'], format: int64}
