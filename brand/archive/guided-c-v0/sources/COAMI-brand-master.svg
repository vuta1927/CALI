    <g transform="translate(20 -16) scale(.43)"><path d="M746 264C684 194 596 156 500 156C304 156 160 308 160 512C160 716 304 868 500 868C596 868 684 830 746 760" fill="none" stroke="#1A1206" stroke-width="136" stroke-linecap="round"/><path d="M406 638L512 532L620 424" fill="none" stroke="#1A1206" stroke-width="80" stroke-linecap="round"/><circle cx="694" cy="350" r="52" fill="#1A1206"/></g>
