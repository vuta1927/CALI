    <text x="0" y="116" fill="#FFF3EC" font-family="Avenir Next, Arial, sans-serif" font-size="34">Rising route = guided progress</text>
    <text x="0" y="168" fill="#FFF3EC" font-family="Avenir Next, Arial, sans-serif" font-size="34">Point = coach presence, not a chatbot</text>
    <text x="0" y="268" fill="#FF7A2F" font-family="Avenir Next, Arial, sans-serif" font-size="38" font-weight="700">PALETTE</text>
