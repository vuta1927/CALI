<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1400" role="img" aria-labelledby="title desc">
  <title id="title">COAMI identity master</title>
  <desc id="desc">Editable master showing the recommended Guided Companion C in color and monochrome.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="2400" y2="1400" gradientUnits="userSpaceOnUse"><stop stop-color="#0F0B07"/><stop offset="1" stop-color="#1A1206"/></linearGradient>
    <linearGradient id="g" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse"><stop stop-color="#FF7A2F"/><stop offset=".52" stop-color="#FC4C02"/><stop offset="1" stop-color="#E83F00"/></linearGradient>
  </defs>
  <rect width="2400" height="1400" fill="url(#bg)"/>
