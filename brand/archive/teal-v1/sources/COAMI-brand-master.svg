<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1400" role="img" aria-labelledby="title desc">
  <title id="title">COAMI identity master</title>
  <desc id="desc">Editable master showing the recommended Guided Companion C in color and monochrome.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="2400" y2="1400" gradientUnits="userSpaceOnUse"><stop stop-color="#071927"/><stop offset="1" stop-color="#0B2742"/></linearGradient>
    <linearGradient id="g" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse"><stop stop-color="#2FF6C4"/><stop offset=".52" stop-color="#00D4C6"/><stop offset="1" stop-color="#00A7E1"/></linearGradient>
  </defs>
  <rect width="2400" height="1400" fill="url(#bg)"/>
  <text x="120" y="140" fill="#EAF7FF" font-family="Avenir Next, Arial, sans-serif" font-size="72" font-weight="700">COAMI — GUIDED COMPANION C</text>
  <text x="120" y="214" fill="#8CB2C8" font-family="Avenir Next, Arial, sans-serif" font-size="36">Recommended implementation direction · pending human approval and trademark review</text>
  <g transform="translate(90 250)">
    <rect width="980" height="980" rx="80" fill="#0E324F" stroke="#3A647B" stroke-width="3"/>
    <g transform="translate(-22 -22)">
