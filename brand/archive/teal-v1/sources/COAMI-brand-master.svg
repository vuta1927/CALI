    <g transform="translate(20 -16) scale(.43)"><path d="M746 264C684 194 596 156 500 156C304 156 160 308 160 512C160 716 304 868 500 868C596 868 684 830 746 760" fill="none" stroke="#0B2742" stroke-width="136" stroke-linecap="round"/><path d="M406 638L512 532L620 424" fill="none" stroke="#0B2742" stroke-width="80" stroke-linecap="round"/><circle cx="694" cy="350" r="52" fill="#0B2742"/></g>
    <text x="470" y="275" fill="#0B2742" font-family="Avenir Next, Arial, sans-serif" font-size="180" font-weight="700" letter-spacing="18">COAMI</text>
