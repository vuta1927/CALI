name: security

# BE-005 / docs/16 B4 hardening: a secret scan over the whole history and a check for NuGet packages with known
# vulnerabilities. Both run on ubuntu (no macOS minutes). No path filter: a leaked secret can arrive in any file,
# and the weekly run catches advisories published after the last change to the backend.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  gitleaks:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The image is pinned by tag and digest (v8.30.1). Findings are redacted in the log; the job fails on any leak.
      # Allow-list false positives in .gitleaks.toml rather than loosening this step.
      - name: Scan history for secrets
        run: >-
          docker run --rm
          --user "$(id -u):$(id -g)"
          -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo
          -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --no-banner --redact --log-opts="--all"

  vulnerable-packages:
    name: NuGet packages with known vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/global.json
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Cali.sln

      # `dotnet list package --vulnerable` exits 0 even when it finds something, so the output is checked.
      # An unreachable advisory source is also a failure: a scan that could not run must not pass.
      - name: Fail on vulnerable packages (direct and transitive)
        run: |
          dotnet list Cali.sln package --vulnerable --include-transitive 2>&1 | tee vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then
            echo "::error::Vulnerable NuGet packages found; see the log above."
            exit 1
          fi
          if grep -Eq "NU1900|Unable to load the service index|Error while getting vulnerability data" vulnerable.txt; then
            echo "::error::The vulnerability source could not be read; the scan did not run."
            exit 1
          fi
