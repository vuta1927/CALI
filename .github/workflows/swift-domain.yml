name: swift-domain

on:
  push:
    paths:
      - "ios/Packages/CaliDomain/**"
      - "fixtures/reducer/**"
      - ".github/workflows/swift-domain.yml"
  pull_request:
    paths:
      - "ios/Packages/CaliDomain/**"
      - "fixtures/reducer/**"
      - ".github/workflows/swift-domain.yml"

concurrency:
  group: swift-domain-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: CaliDomain (Linux, Swift 6.2)
    runs-on: ubuntu-latest
    container: swift:6.2-noble
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ios/Packages/CaliDomain
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build --build-tests
      - name: Test (includes fixtures/reducer conformance vectors)
        run: swift test --skip-build
