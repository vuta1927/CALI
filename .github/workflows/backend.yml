name: backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "db/**"
      - "contracts/**"
      - "docker-compose.yml"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - "db/**"
      - "contracts/**"
      - "docker-compose.yml"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  build-test:
    name: build + test (Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/global.json
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: backend/**/*.csproj

      - name: Restore
        run: dotnet restore Cali.sln

      - name: Build
        run: dotnet build Cali.sln -c Release --no-restore

      - name: Pre-pull PostgreSQL image
        run: docker pull postgres:16.15

      - name: Test
        run: >-
          dotnet test Cali.sln -c Release --no-build
          --logger "trx;LogFilePrefix=results"
          --results-directory ${{ github.workspace }}/TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: TestResults/
          if-no-files-found: ignore

  migrate-blank:
    name: migrate command on blank PG16
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_DB: cali
          POSTGRES_USER: cali
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cali -d cali"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/global.json
          dotnet-version: 10.0.x

      - name: Apply migrations (Production mode, no dev seed)
        working-directory: backend
        env:
          ConnectionStrings__Cali: Host=localhost;Port=5432;Database=cali;Username=cali;Password=ci-only-password
        run: dotnet run --project src/Cali.Api -c Release -- migrate --environment Production

      - name: Validate compose file
        env:
          POSTGRES_PASSWORD: ci-only-password
        run: docker compose config --quiet
